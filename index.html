<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Editless Remote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #0b0c10; --panel: #171a21; --panel2: #20242d; --text: #ffffff; --muted: #a7adb8; --line: #2c313c;
    --keep: #22c55e; --broll: #d946ef; --short: #22d3ee; --hi: #facc15; --red: #ef4444; --blue: #3b82f6; --orange: #fb923c;
    --glow: transparent;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { position: fixed; inset: 0; overflow: hidden; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; touch-action: none; }
  button { font: inherit; color: inherit; }

  /* ---------- main layout ---------- */
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px;
    padding: calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px); }
  #top { display: flex; align-items: center; gap: 8px; flex: none; }
  .seg { display: flex; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; overflow: hidden; flex: none; }
  .seg button { background: none; border: 0; padding: 9px 13px; font-size: 15px; font-weight: 800; letter-spacing: .5px; color: var(--muted); }
  .seg button.on { background: #fff; color: #000; }
  #clock { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-align: center; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #menuBtn { flex: none; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 7px 14px; font-size: 20px; font-weight: 800; }
  /* Remote / Phone view switch (2.3.0), in the header of both views */
  .seg.view button { padding: 9px 10px; font-size: 13px; letter-spacing: 0; }
  @media (max-width: 440px) {
    #top { gap: 6px; }
    #top .seg button { padding: 9px 8px; font-size: 13px; letter-spacing: 0; }
    #clock { font-size: 15px; }
    #clock .sec { display: none; }
    #menuBtn { padding: 7px 11px; }
  }

  #remote { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 22px;
    background: #111319; border: 3px solid #252a34; box-shadow: 0 0 0 4px var(--glow); transition: box-shadow .08s; }
  #face { flex: none; display: flex; align-items: center; justify-content: center; gap: 12px; }
  #screenWrap { position: relative; height: min(33vh, 60vw); aspect-ratio: 1; border-radius: 6px; padding: 5px;
    background: #2a2d33; box-shadow: inset 0 0 0 2px #3b3f47; transition: box-shadow .15s, background .15s; }
  #screenWrap.lightOn { background: #fffbe8; box-shadow: 0 0 26px 6px rgba(255,248,215,.75), inset 0 0 0 2px #fff; }
  #epd { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 2px; }
  #leds { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .led { width: 46px; height: 46px; border-radius: 50%; background: #23262d; border: 3px solid #3a3e47; transition: background .03s; }
  .led.small { width: 30px; height: 30px; }
  #rgb.rec { animation: rec 1s infinite; }
  @keyframes rec { 0%, 100% { background: #5a1414; box-shadow: none; } 50% { background: var(--red); box-shadow: 0 0 22px 6px var(--red); } }
  #sunWrap { display: none; }
  #remote.mini #sunWrap { display: block; }
  #sun.on { background: #ff1a1a; box-shadow: 0 0 26px 8px #ff1a1a; border-color: #ff8080; }
  .ledCap { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.2; }

  #keys { flex: 1; min-height: 0; display: grid; gap: 8px; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); }
  .key { position: relative; border: 0; border-radius: 16px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 4px; padding: 4px; touch-action: none; background: #2a2f3a; color: #fff;
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.35); overflow: hidden; }
  .key .kl { font-size: clamp(17px, 5.6vw, 34px); font-weight: 900; line-height: 1; text-align: center; letter-spacing: .3px; }
  .key .ks { font-size: clamp(9px, 2.7vw, 13px); font-weight: 600; opacity: .85; line-height: 1.15; text-align: center; }
  #remote.main .key { container-type: inline-size; }
  #remote.main .key .kl { font-size: min(34px, 27cqi); }
  #remote.main .key.m .kl { font-size: min(28px, 21cqi); }
  #remote.main .key.s .kl { font-size: min(26px, 16cqi); }
  #remote.main .key.xs .kl { font-size: min(24px, 13.5cqi); }
  #remote.mini .key.m .kl, #remote.mini .key.s .kl { font-size: clamp(22px, 7vw, 36px); }
  .key.time { background: #262b35; border-bottom: 6px solid var(--keep); }
  .key.keepall { background: var(--keep); color: #04120a; }
  .key.flag { background: #e8e8e8; color: #000; }
  .key.note { background: #7f1d1d; }
  .key.tag-broll { background: var(--broll); color: #1a001e; }
  .key.tag-short { background: var(--short); color: #001a1f; }
  .key.tag-highlight { background: var(--hi); color: #1f1700; }
  .key.layer { background: #1d2a44 !important; color: #fff !important; border: 2px dashed #6b8fd6; border-bottom-width: 2px; }
  .key.down { transform: scale(.96); filter: brightness(1.35); }
  #remote.locked .key { opacity: .35; }
  #remote.mini #keys { grid-template-columns: 1fr; grid-template-rows: repeat(6, 1fr); }
  #remote.mini .key { flex-direction: row; gap: 14px; }
  #remote.mini .key .kl { font-size: clamp(22px, 7vw, 36px); }
  #remote.mini #screenWrap { display: none; }
  #remote.mini #leds { flex-direction: row; gap: 26px; }
  #remote.mini .led { width: 56px; height: 56px; }

  #last { flex: none; display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 12px;
    border-left: 8px solid var(--lastc, #555); padding: 6px 10px; min-height: 52px; }
  #lastN { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #lastBody { flex: 1; min-width: 0; }
  #lastText { font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #lastSub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- history list under the keys (2.2.0, like the October app's log) ---------- */
  #app.withList #screenWrap { height: min(27vh, 52vw); }
  #hwrap { flex: none; display: none; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  #app.withList #hwrap { display: flex; }
  #hhead { flex: none; display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px; border-bottom: 1px solid var(--line); min-height: 36px; }
  #hhead b { flex: 1; font-size: 13px; color: var(--muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hwrap.on { border-color: var(--blue); }
  #hwrap.on #hhead { background: #1d2a44; }
  #hwrap.on #hhead b { color: #fff; }
  #hhead .btn { padding: 6px 12px; font-size: 13px; }
  #hlist { position: relative; height: clamp(84px, 17vh, 170px); overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; }
  .hr { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 6px 8px; border-bottom: 1px solid var(--line); border-left: 6px solid #444; font-size: 14px; }
  .hr .n { min-width: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .hr .w { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .hr .l { flex: 1; min-width: 0; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hr .chip { font-size: 11px; font-weight: 800; padding: 1px 5px; border-radius: 6px; color: #000; }
  .hr.kept { border-left-color: var(--keep); }
  .hr.br { border-left-color: var(--broll); }
  .hr.dead { border-left-color: var(--red); }
  .hr.dead .l { text-decoration: line-through; color: #ff9a9c; }
  .hr.sel { background: #26324a; box-shadow: inset 0 0 0 2px var(--blue); }
  .hr .acts { flex-basis: 100%; display: flex; gap: 6px; flex-wrap: wrap; }
  .hr .acts .btn { padding: 8px 10px; font-size: 12px; }
  .hr .acts .btn.ton { background: #fff; color: #000; }
  .hempty { padding: 12px; color: var(--muted); font-size: 13px; text-align: center; }
  @media (max-height: 700px) {   /* small phones: keep the keys big enough */
    #app.withList #hlist { height: 74px; }
    #app.withList #screenWrap { height: min(24vh, 50vw); }
    #app.withList #last { min-height: 44px; padding: 3px 10px; }
  }

  /* first-time key hint for MODE and HISTORY */
  #hint { position: absolute; left: 8px; right: 8px; top: calc(env(safe-area-inset-top) + 52px); z-index: 8; display: none; pointer-events: none;
    background: rgba(13,20,36,.97); border: 2px solid var(--blue); border-radius: 14px; padding: 10px 12px; font-size: 13px; line-height: 1.4; color: #e6e8ec; }
  #hint.show { display: block; }
  #hint b.h { display: block; font-size: 16px; color: #fff; margin-bottom: 4px; }
  #hint table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 4px 0; }
  #hint td { border: 1px solid #34405a; padding: 3px; text-align: center; font-size: 11px; vertical-align: top; }
  #hint td i { display: block; font-style: normal; color: var(--muted); font-size: 10px; }
  #hint .x { color: var(--muted); font-size: 12px; margin-top: 4px; }

  @media (orientation: landscape) and (max-height: 600px) {
    #app { flex-direction: row; flex-wrap: wrap; }
    #top { width: 100%; }
    #remote { flex-direction: row; height: calc(100% - 52px); }
    #face { flex-direction: column; }
    #screenWrap, #app.withList #screenWrap { height: min(60vh, 40vw); }
    #last { display: none; }
    #app.withList #hwrap { display: none; }
  }

  /* ---------- sheet (menu) ---------- */
  #sheet { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: none; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px); touch-action: pan-y; }
  #sheet.show { display: flex; }
  .sheetHead { display: flex; gap: 8px; align-items: center; }
  .sheetHead b { flex: 1; font-size: 20px; }
  .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 700; }
  .btn.primary { background: #2b3d63; border-color: #41598c; }
  .btn.danger { color: #ff9a9c; border-color: #5a2a2c; }
  .tabs { display: flex; gap: 4px; margin: 10px 0 8px; overflow-x: auto; flex: none; }
  .tabs button { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 6px; font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .tabs button.on { color: #000; background: #fff; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding-bottom: 20px; }
  .scroll p, .scroll li { color: #d8dbe1; font-size: 14px; line-height: 1.45; }
  .scroll h3 { margin: 18px 0 6px; font-size: 16px; }
  .scroll h4 { margin: 12px 0 4px; font-size: 14px; color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .row > .btn { flex: 1 1 140px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
  .card.cur { border-color: var(--blue); box-shadow: inset 4px 0 0 var(--blue); }
  .card .t { font-weight: 800; font-size: 15px; }
  .card .m { color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .ev { display: flex; gap: 8px; align-items: flex-start; padding: 7px 8px; border-bottom: 1px solid var(--line); border-left: 6px solid #555; }
  .ev .n { min-width: 34px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .ev .b { flex: 1; min-width: 0; }
  .ev .l { font-weight: 800; font-size: 14px; }
  .ev .d { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ev.kept { border-left-color: var(--keep); }
  .ev.dropped { border-left-color: var(--red); }
  .ev.dropped .l { text-decoration: line-through; color: #ff9a9c; }
  .ev.mod { border-left-color: #444; opacity: .85; }
  .ev .acts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .ev .acts .btn { padding: 7px 10px; font-size: 12px; }
  table.km { border-collapse: collapse; width: 100%; font-size: 12px; margin: 6px 0; table-layout: fixed; }
  table.km td { border: 1px solid var(--line); padding: 5px 4px; vertical-align: top; text-align: center; color: #e6e8ec; }
  table.km td b { display: block; font-size: 13px; color: #fff; }
  label.set { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  label.set select, label.set input[type=number] { background: var(--panel2); color: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 7px; font: inherit; font-size: 14px; max-width: 55%; }
  label.set input[type=checkbox] { width: 24px; height: 24px; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }

  #toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.95); z-index: 30; pointer-events: none;
    background: rgba(0,0,0,.92); border: 2px solid #444; color: #fff; padding: 14px 20px; border-radius: 14px; font-size: 19px;
    font-weight: 800; text-align: center; opacity: 0; transition: opacity .12s, transform .12s; max-width: 88vw; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #toast.error { border-color: var(--red); }
  #toast small { display: block; font-size: 14px; font-weight: 500; margin-top: 6px; color: #ddd; }

  /* ---------- remote sound preview (2.1.0) ---------- */
  #pv { position: fixed; inset: 0; z-index: 12; background: var(--bg); display: none; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px); touch-action: pan-y; }
  #pv.show { display: flex; }
  #pvWave { width: 100%; height: 140px; display: block; border-radius: 8px; touch-action: none; background: #0f1116; }
  .pvFoot { flex: none; display: flex; gap: 8px; align-items: center; padding-top: 8px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .pvFoot .seg button { padding: 10px 12px; font-size: 14px; }
  .pvFoot .btn { padding: 10px 14px; }
  #pvTime { flex: 1; text-align: right; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pvBar { width: 100%; height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; }
  .pvBar i { display: block; height: 100%; width: 0; background: var(--blue); }
  .pvTW { overflow-x: auto; touch-action: pan-x pan-y; }
  table.pvt { border-collapse: collapse; width: 100%; font-size: 12px; margin: 6px 0; font-variant-numeric: tabular-nums; }
  table.pvt th, table.pvt td { border: 1px solid var(--line); padding: 4px; text-align: right; color: #e6e8ec; vertical-align: top; }
  table.pvt th:first-child, table.pvt td:first-child { text-align: left; }
  table.pvt th { color: var(--muted); font-weight: 700; }
  table.pvt small { display: block; color: var(--muted); font-size: 11px; }
  .pvWarn { background: #2a2210; border: 1px solid #5c4a1a; border-radius: 10px; padding: 8px 10px; font-size: 13px; color: #f3e3b5; margin: 8px 0; }
  .pvLegend { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .scroll .pvM, .pvM { font-size: 12px; color: var(--muted); margin: 6px 0; line-height: 1.4; }
  #pvPresets .btn.on { background: #fff; color: #000; }

  /* ---------- phone view (2.3.0): a normal one-handed phone app over the same data ---------- */
  body.v-phone #app { display: none; }
  #phone { display: none; }
  body.v-phone #phone { display: flex; }
  #phone {
    --p-bg: #0b0c10; --p-card: #171a21; --p-btn: #232833; --p-btn2: #2c3240; --p-text: #ffffff; --p-muted: #a7adb8; --p-line: #2c313c;
    --p-sel: #1d2a44; --p-on: #ffffff; --p-onText: #000000; --p-dead: #ff9a9c; --p-mark: #22c55e; --p-markText: #04120a;
    position: absolute; inset: 0; flex-direction: column; background: var(--p-bg); color: var(--p-text); color-scheme: dark;
    padding: calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 10px); gap: 8px; }
  @media (prefers-color-scheme: light) {
    #phone { --p-bg: #f3f4f6; --p-card: #ffffff; --p-btn: #e5e7eb; --p-btn2: #d6d9df; --p-text: #111318; --p-muted: #555b66; --p-line: #d4d7dd;
      --p-sel: #dbe6ff; --p-on: #111318; --p-onText: #ffffff; --p-dead: #b42318; --p-mark: #16a34a; --p-markText: #ffffff; color-scheme: light; }
  }
  :where(#phone) button { font: inherit; color: inherit; touch-action: manipulation; }   /* :where keeps this below the button classes */
  #pTop { flex: none; display: flex; align-items: center; gap: 6px; min-height: 48px; }
  #pSess { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 4px 2px; min-height: 48px; }
  #pSess b { display: block; font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pSess small { display: block; font-size: 12px; color: var(--p-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  #phone .seg { background: var(--p-card); border-color: var(--p-line); }
  #phone .seg button { color: var(--p-muted); min-height: 48px; }
  #phone .seg { border-width: 1px; }
  #phone .seg button.on { background: var(--p-on); color: var(--p-onText); }
  #pMenu { flex: none; min-width: 48px; min-height: 48px; background: var(--p-card); border: 2px solid var(--p-line); border-radius: 12px; font-size: 20px; font-weight: 800; }
  #pStatus { flex: none; display: flex; align-items: center; gap: 10px; background: var(--p-card); border-radius: 14px; padding: 8px 12px; min-height: 56px;
    border-left: 8px solid var(--lastc, #888); box-shadow: 0 0 0 3px var(--glow); transition: box-shadow .08s; }
  #pStatus .n { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #pStatus .b { flex: 1; min-width: 0; }
  #pLastText { font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pLastSub { font-size: 13px; color: var(--p-muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #pStatus.rec { border-left-color: var(--red); box-shadow: 0 0 0 3px var(--red); }
  #pStatus.wait { border-left-color: #f59e0b; box-shadow: 0 0 0 3px #f59e0b; }
  #pLevel { margin-top: 6px; height: 10px; border-radius: 5px; background: var(--p-btn); overflow: hidden; }
  #pLevel i { display: block; height: 100%; width: 0; background: #22c55e; transition: width .05s linear; }
  #pLevel.hot i { background: var(--red); }
  #phone .pb.note.wait { background: #b45309; border-color: #b45309; animation: none; }
  .pr .prh { display: flex; align-items: stretch; }
  .pr .prh .top { flex: 1; min-width: 0; }
  .pr .pplay { flex: none; width: 56px; margin: 6px 8px 6px 0; border-radius: 12px; border: 1px solid var(--p-line); background: var(--p-btn); font-size: 22px; line-height: 1; }
  .pr .pplay.on { background: var(--p-on); color: var(--p-onText); }
  #pList { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain;
    background: var(--p-card); border: 1px solid var(--p-line); border-radius: 14px; }
  .pr { border-bottom: 1px solid var(--p-line); border-left: 6px solid #888; }
  .pr .top { display: flex; align-items: center; gap: 8px; padding: 10px 10px; min-height: 56px; width: 100%; background: none; border: 0; text-align: left; flex-wrap: wrap; }
  .pr .num { min-width: 30px; font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .pr .lab { flex: 1 1 120px; min-width: 0; }
  .pr .lab b { display: block; font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr .lab small { display: block; font-size: 12px; color: var(--p-muted); font-variant-numeric: tabular-nums; }
  .pr .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .pr .chip { font-size: 12px; font-weight: 800; padding: 2px 6px; border-radius: 6px; color: #000; }
  .pr.kept { border-left-color: var(--keep); }
  .pr.br { border-left-color: var(--broll); }
  .pr.dead { border-left-color: var(--red); }
  .pr.dead .lab b { text-decoration: line-through; color: var(--p-dead); }
  .pr.sel { background: var(--p-sel); }
  .pr .acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 10px 12px; }
  .pr .acts .wide { grid-column: span 3; }
  .pr .acts .half { grid-column: span 3; }
  .pr .texts { padding: 0 10px 8px; font-size: 13px; color: var(--p-muted); overflow-wrap: anywhere; }
  .pb { min-height: 48px; border-radius: 12px; border: 1px solid var(--p-line); background: var(--p-btn); font-size: 14px; font-weight: 800; padding: 6px 4px; line-height: 1.15; overflow-wrap: break-word; }
  .pb.on { background: var(--p-on); color: var(--p-onText); border-color: var(--p-on); }
  .pb.danger { color: var(--p-dead); }
  .pb small { display: block; font-size: 11px; font-weight: 600; opacity: .8; }
  .pempty { padding: 24px 16px; color: var(--p-muted); font-size: 15px; text-align: center; line-height: 1.5; }
  #pDock { flex: none; display: flex; flex-direction: column; gap: 8px; }
  #pTarget { display: flex; align-items: center; gap: 8px; min-height: 48px; }
  #pTargetText { flex: 1; min-width: 0; font-size: 13px; color: var(--p-muted); }
  #pTargetText b { color: var(--p-text); }
  #pUndo, #pMoreBtn { flex: none; min-width: 72px; }
  #pTags { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #pTags .pb { min-height: 54px; font-size: 15px; }
  #pTags .pb[data-tag="broll"] { border-bottom: 5px solid var(--broll); }
  #pTags .pb[data-tag="short"] { border-bottom: 5px solid var(--short); }
  #pTags .pb[data-tag="highlight"] { border-bottom: 5px solid var(--hi); }
  #pTags .pb.on[data-tag="broll"] { background: var(--broll); color: #1a001e; border-color: var(--broll); }
  #pTags .pb.on[data-tag="short"] { background: var(--short); color: #001a1f; border-color: var(--short); }
  #pTags .pb.on[data-tag="highlight"] { background: var(--hi); color: #1f1700; border-color: var(--hi); }
  #pWin { display: flex; box-shadow: 0 0 0 1px var(--p-line); border-radius: 12px; overflow: hidden; }
  #pWin button { flex: 1; min-width: 0; min-height: 48px; border: 0; background: var(--p-btn); font-size: 14px; font-weight: 800; padding: 0; color: var(--p-muted); }
  #pWin button + button { border-left: 1px solid var(--p-line); }
  #pWin button.on { background: var(--p-on); color: var(--p-onText); }
  #pMain { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 8px; }
  #pMain .pb { min-height: 88px; font-size: 17px; }
  #pMark { background: var(--p-mark); color: var(--p-markText); border-color: var(--p-mark); font-size: 24px !important; }
  #pMark small { font-size: 13px; }
  #pFlag { background: #e8e8e8; color: #000; }
  .pb.note { background: #7f1d1d; color: #fff; border-color: #7f1d1d; }
  .pb.note.rec { background: var(--red); border-color: var(--red); animation: rec 1s infinite; }
  #phone [data-hold] { touch-action: none; }
  .pb:active, .pb.down { filter: brightness(1.25); transform: scale(.98); }
  @media (max-height: 640px) {
    #pMain .pb { min-height: 72px; }
    #pStatus { min-height: 48px; padding: 4px 10px; }
  }
  /* "More" sheet: everything the remote's MODE layer and menu can do, as labelled buttons */
  #pMore { position: fixed; inset: 0; z-index: 9; display: none; flex-direction: column; justify-content: flex-end; background: rgba(0,0,0,.5); }
  #pMore.show { display: flex; }
  #pMoreCard { background: var(--p-bg); color: var(--p-text); border-radius: 18px 18px 0 0; max-height: 86%; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain;
    padding: 12px 12px calc(env(safe-area-inset-bottom) + 12px); }
  #pMoreCard h4 { margin: 12px 2px 6px; font-size: 13px; color: var(--p-muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  #pMoreCard .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #pMoreCard .head { display: flex; align-items: center; gap: 8px; }
  #pMoreCard .head b { flex: 1; font-size: 18px; }

  #clockScreen { position: fixed; inset: 0; z-index: 20; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #clockScreen.show { display: flex; }
  #csTime { font-size: 14vw; font-weight: 900; font-variant-numeric: tabular-nums; }
  #csDate { font-size: 5vw; color: #bbb; font-variant-numeric: tabular-nums; }
  #clockScreen p { color: #888; margin: 0; font-size: 15px; }
</style>
</head>

</div>

<!-- Phone view (2.3.0): same marks, tags, notes, sessions and settings as the remote view -->

<!-- Signal processing for the remote sound preview. Plain text here; the app runs it in a Worker made
     from a Blob (so a long clip does not freeze the page) and also on the main thread for the numbers. -->
<script id="dspSrc" type="text/plain">
const DSP = (() => {
  'use strict';
  // ---- hardware figures; sources are listed in the preview panel's help ----
  const HW = {
    micSens: 0.012589,   // V rms per Pa: -38 dBV/Pa (ZTS6216 data sheet p.3)
    micNoiseA: 7.08e-6,  // V rms, A-weighted: 65 dB(A) SNR = 29 dB(A) SPL (same page)
    micEnbw: 13500,      // Hz: flat bandwidth that reproduces research\audio-chain.md's amplifier losses
    micAop: 125,         // dB SPL: the microphone's own limit (research file)
    adcHalf: 1.05,       // V: converter 0 dB range 0 to 2.1 V, input biased at about 1.0 V (CH585 ch.15, circuit.py)
    adcFo: 95238,        // Hz per channel with two channels scanned (circuit.py, fifth pass)
    simFa: 96000,        // the simulation runs that scan at 96 kHz (0.8 % faster) so the rate steps are whole numbers
    rcFc: 32900,         // Hz: 2.2k / 2.2 nF RC in front of each converter pin (circuit.py)
  };
  HW.micDens = HW.micNoiseA / Math.sqrt(HW.micEnbw);   // about 61 nV per root hertz
  const AMPS = {
    mcp6002: { label: 'MCP6002, 2 stages of 6.1 = 37.2', gain: 37.21, dens: 28.3e-9, poles: [164000, 164000] },
    lmv321: { label: 'LMV321, gain 40', gain: 40, dens: 46e-9, poles: [25000] },
    tlv9061: { label: 'TLV9061, gain 40', gain: 40, dens: 16e-9, poles: [250000] },
    ideal: { label: 'Ideal, gain 40 (no hiss, no roll-off)', gain: 40, dens: 0, poles: [] },
  };
  const BPS = { raw16: 2, pack12: 1.5, adpcm: 0.5 };   // bytes per sample per path (ADPCM: 4 bits; block headers add about 1 %)
  const CAPS = [['16 MB chip', 16777216], ['128 MB chip', 134217728], ['32 GB card', 32e9]];
  const db = x => 20 * Math.log10(x);

  // xorshift32 + Box-Muller: repeatable noise, so A/B comparisons sound the same each run
  function rng(seed) {
    let s = (seed >>> 0) || 1, spare = null;
    const u = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return (s + 0.5) / 4294967296; };
    return () => {
      if (spare !== null) { const v = spare; spare = null; return v; }
      const a = Math.sqrt(-2 * Math.log(u())), b = 2 * Math.PI * u();
      spare = a * Math.sin(b); return a * Math.cos(b);
    };
  }
  // first-order low-pass (bilinear with pre-warp; matched pole when the corner is above 0.45 fs)
  function onePole(fc, fs) {
    if (fc < 0.45 * fs) {
      const K = Math.tan(Math.PI * fc / fs), b0 = K / (1 + K), a1 = (K - 1) / (K + 1);
      let x1 = 0, y1 = 0;
      return x => { const y = b0 * (x + x1) - a1 * y1; x1 = x; y1 = y; return y; };
    }
    const a = Math.exp(-2 * Math.PI * fc / fs); let y1 = 0;
    return x => (y1 = (1 - a) * x + a * y1);
  }
  function I0(x) { let s = 1, t = 1; for (let k = 1; k < 60; k++) { t *= (x / (2 * k)) ** 2; s += t; if (t < 1e-14 * s) break; } return s; }

  // Streaming sample-rate converter. filter = true: Kaiser-windowed sinc low-pass at 91 % of the lower
  // rate's Nyquist when going down (95 % going up). filter = false: plain linear interpolation, i.e. the
  // value at that instant with nothing removed first, so everything above the new Nyquist folds back.
  function Resampler(fin, fout, filter, Z) {
    const step = fin / fout, P = 256;
    let L = 1, tab = null;
    if (filter) {
      const c = fout < fin ? 0.91 * fout / fin : 0.95;   // c = 2 x cutoff / input rate
      Z = Z || (fout < fin ? 20 : 12);
      L = Math.ceil(Z / c);
      const n = L * P + 2, beta = 8.6, ib = I0(beta);
      tab = new Float64Array(n);
      for (let i = 0; i < n; i++) {
        const t = i / P, r = t / L;
        tab[i] = r >= 1 ? 0 : c * (t === 0 ? 1 : Math.sin(Math.PI * c * t) / (Math.PI * c * t)) * I0(beta * Math.sqrt(1 - r * r)) / ib;
      }
    }
    // whole-number ratios (96 k from 48 k, 16 k from 96 k...): precomputed kernels, one per phase
    let D = 0, kern = null;
    if (tab) for (let d = 1; d <= 64; d++) if (Math.abs(step * d - Math.round(step * d)) < 1e-9) { D = d; break; }
    if (D) {
      kern = [];
      for (let ph = 0; ph < D; ph++) {
        const fr = ph * step - Math.floor(ph * step), kk = new Float64Array(2 * L);
        for (let j = 0; j < 2 * L; j++) { const d = Math.abs(j - L + 1 - fr), pos = d * P, q = pos | 0; kk[j] = q + 1 < tab.length ? tab[q] + (tab[q + 1] - tab[q]) * (pos - q) : 0; }
        kern.push(kk);
      }
    }
    let buf = new Float64Array(8192), len = 0, base = 0, m = 0, total = 0;
    function append(x) {
      if (len + x.length > buf.length) { const nb = new Float64Array(Math.max(buf.length * 2, len + x.length)); nb.set(buf.subarray(0, len)); buf = nb; }
      buf.set(x, len); len += x.length;
    }
    function produce(final) {
      const avail = base + len;
      const outMax = final ? Math.floor(total * fout / fin + 1e-9) : Infinity;
      const cap = final ? Math.max(0, outMax - m) : Math.max(0, Math.floor((avail - L - 1 - m * step) / step) + 2);
      const res = new Float32Array(cap);
      let k = 0;
      while (m < outMax && k < cap) {
        const t = m * step, i = Math.floor(t);
        if (!final && i + L + 1 > avail) break;
        let y = 0;
        const j0 = i - L + 1 - base;
        if (kern && j0 >= 0 && j0 + 2 * L <= len) {
          const kk = kern[m % D];
          for (let j = 0; j < 2 * L; j++) y += buf[j0 + j] * kk[j];
        } else if (tab) {
          for (let j = i - L + 1; j <= i + L; j++) {
            const jj = j - base; if (jj < 0 || jj >= len) continue;
            const d = j > t ? j - t : t - j, pos = d * P, q = pos | 0;
            y += buf[jj] * (tab[q] + (tab[q + 1] - tab[q]) * (pos - q));
          }
        } else {
          const a = i - base, x0 = a >= 0 && a < len ? buf[a] : 0, x1 = a + 1 >= 0 && a + 1 < len ? buf[a + 1] : 0;
          y = x0 + (x1 - x0) * (t - i);
        }
        res[k++] = y; m++;
      }
      const keep = Math.min(base + len, Math.max(base, Math.floor(m * step) - L - 1)), drop = keep - base;
      if (drop > 0) { buf.copyWithin(0, drop, len); len -= drop; base = keep; }
      return res.subarray(0, k);
    }
    return { push(x) { total += x.length; append(x); return produce(false); }, flush() { return produce(true); }, L, step };
  }

  // Converter: bits over the 2.1 V range; effective bits below that add white noise so the converter's
  // signal-to-noise is 6.02 x ENOB + 1.76 dB for a full-scale sine.
  function makeAdc(bits, enob) {
    const half = HW.adcHalf, lsb = 2 * half / 2 ** bits, hi = (2 ** (bits - 1) - 1) * lsb, lo = -(2 ** (bits - 1)) * lsb;
    const sigE = (half / Math.SQRT2) / 10 ** ((6.02 * enob + 1.76) / 20), sigQ = lsb / Math.sqrt(12);
    const extra = enob < bits ? Math.sqrt(Math.max(0, sigE * sigE - sigQ * sigQ)) : 0;
    return { lsb, hi, lo, extra, sig: Math.max(sigE, sigQ), half };
  }
  // in place; returns nothing; calls clip(i) for each clipped sample
  function adcBlock(a, adc, rnd, clip) {
    const { lsb, hi, lo, extra, half } = adc;
    for (let i = 0; i < a.length; i++) {
      let v = a[i];
      if (extra) v += extra * rnd();
      if (v >= half) { v = hi; clip(i); } else if (v < -half) { v = lo; clip(i); }
      else { v = Math.round(v / lsb) * lsb; if (v > hi) v = hi; }
      a[i] = v;
    }
  }
  function storeQuant(x, bits) {
    const lsb = 2 * HW.adcHalf / 2 ** bits, mx = 2 ** (bits - 1) - 1, mn = -(2 ** (bits - 1));
    for (let i = 0; i < x.length; i++) { let c = Math.round(x[i] / lsb); if (c > mx) c = mx; else if (c < mn) c = mn; x[i] = c * lsb; }
  }

  // ---- IMA ADPCM (the standard 4-bit scheme: 89-step table, two samples per byte) ----
  const IMA_STEP = [7, 8, 9, 10, 11, 12, 13, 14, 16, 17, 19, 21, 23, 25, 28, 31, 34, 37, 41, 45, 50, 55, 60, 66, 73, 80, 88, 97, 107, 118,
    130, 143, 157, 173, 190, 209, 230, 253, 279, 307, 337, 371, 408, 449, 494, 544, 598, 658, 724, 796, 876, 963, 1060, 1166, 1282, 1411,
    1552, 1707, 1878, 2066, 2272, 2499, 2749, 3024, 3327, 3660, 4026, 4428, 4871, 5358, 5894, 6484, 7132, 7845, 8630, 9493, 10442, 11487,
    12635, 13899, 15289, 16818, 18500, 20350, 22385, 24623, 27086, 29794, 32767];
  const IMA_IDX = [-1, -1, -1, -1, 2, 4, 6, 8];
  function imaStep(st, nib) {   // decoder step shared by encoder and decoder
    let step = IMA_STEP[st.idx], d = step >> 3;
    if (nib & 4) d += step; if (nib & 2) d += step >> 1; if (nib & 1) d += step >> 2;
    st.pred += (nib & 8) ? -d : d;
    if (st.pred > 32767) st.pred = 32767; else if (st.pred < -32768) st.pred = -32768;
    st.idx += IMA_IDX[nib & 7]; if (st.idx < 0) st.idx = 0; else if (st.idx > 88) st.idx = 88;
    return st.pred;
  }
  function imaEncode(s16) {
    const out = new Uint8Array((s16.length + 1) >> 1), st = { pred: 0, idx: 0 };
    for (let i = 0; i < s16.length; i++) {
      let diff = s16[i] - st.pred, nib = 0;
      if (diff < 0) { nib = 8; diff = -diff; }
      let step = IMA_STEP[st.idx];
      if (diff >= step) { nib |= 4; diff -= step; } step >>= 1;
      if (diff >= step) { nib |= 2; diff -= step; } step >>= 1;
      if (diff >= step) nib |= 1;
      imaStep(st, nib);
      out[i >> 1] |= (i & 1) ? nib << 4 : nib;
    }
    return out;
  }
  function imaDecode(bytes, n) {
    const out = new Int16Array(n), st = { pred: 0, idx: 0 };
    for (let i = 0; i < n; i++) out[i] = imaStep(st, (i & 1) ? bytes[i >> 1] >> 4 : bytes[i >> 1] & 15);
    return out;
  }

  // Combining the two paths: use the amplified one unless it is within 1 dB of clipping, then the
  // unamplified one (same scale), held 30 ms after and 2 ms before, with a 2 ms linear crossfade.
  function weights(a, ampFlag, fs) {
    const n = a.length, w = new Float32Array(n), trig = new Uint8Array(n), th = 0.891 * HW.adcHalf;
    const H1 = Math.round(0.030 * fs), H0 = Math.round(0.002 * fs), C = Math.max(1, Math.round(0.002 * fs));
    let last = -1e9;
    for (let i = 0; i < n; i++) {
      if (a[i] >= th || a[i] <= -th || (ampFlag && ampFlag[i])) { trig[i] = 1; last = i; }
      const d = i - last; w[i] = d <= H1 ? 1 : d < H1 + C ? 1 - (d - H1) / C : 0;
    }
    let next = 1e9;
    for (let i = n - 1; i >= 0; i--) {
      if (trig[i]) next = i;
      const d = next - i, v = d <= H0 ? 1 : d < H0 + C ? 1 - (d - H0) / C : 0;
      if (v > w[i]) w[i] = v;
    }
    return w;
  }

  // ---- the whole chain; a generator so the caller can report progress and stay responsive ----
  // src: Float32Array at fs0 (the phone recording); p: settings; p.k = pascals per unit of src.
  function* run(src, fs0, p) {
    const t0 = Date.now();
    const n0 = src.length, fs = p.fs, fa = HW.simFa, S = HW.micSens, k = p.k;
    const nOut = Math.max(1, Math.floor(n0 * fs / fs0 + 1e-9));
    const amp = AMPS[p.amp] || AMPS.mcp6002, G = amp.gain;
    const conv = typeof p.conv === 'string' ? p.conv.split('/').map(Number) : p.conv;
    const adc = makeAdc(conv[0], conv[1]);
    const rnd = rng(p.seed || 20261116);
    const flags = new Uint8Array(nOut);   // 1 heard clip, 2 amplified path clipped, 4 unamplified path used, 8 microphone overload, 16 unamplified path clipped
    const vAop = Math.SQRT2 * 20e-6 * 10 ** (HW.micAop / 20) * S;
    const sigMic = p.micNoise === false ? 0 : HW.micDens * Math.sqrt(fa / 2);
    const sigAmp = amp.dens * Math.sqrt(fa / 2);
    const toOut = i => { const o = Math.floor(i * fs / fa); return o < nOut ? o : nOut - 1; };

  let sunTimer = null, recActive = false;

    sunTimer = setTimeout(() => { if (!recActive) s.classList.remove('on'); }, 220);
  }
  function setRecLight(on) {

  let toastTimer = null;

    EPD.message = text; EPD.messageUntil = Date.now() + 2500; requestDraw();
  }

  // Light, haptic and explanation for each logged action
  function feedback(e, extraSub) {
    const d = derive(); const m = d.mByN.get(e.n);
    let seq, color, sub = '';
    const tgt = e.target != null ? d.mByN.get(e.target) : null;
    const tgtName = tgt ? `#${tgt.n} ${markLabel(tgt)}` : `#${e.target}`;
    switch (e.type) {
      case 'keep': {
        const br = m.tags.includes('broll');
        color = br ? COL.broll : COL.keep; seq = pattern('single', color);
        sub = `${br ? 'B-roll' : 'Keeps'} ${hms(m.from)} to ${hms(m.to)}` + (m.tags.length ? ` · ${tagWords(m)}` : '');
        break;
      }
      case 'keepall': {
        const br = m.tags.includes('broll');
        color = br ? COL.broll : COL.keep; seq = pattern('long', color);
        sub = `${br ? 'B-roll' : 'Keeps'} everything since ${m.fromN ? '#' + m.fromN : 'session start'} (${durLong((m.to - m.from) / 1000)})`;
        break;
      }
      case 'flag': color = COL.white; seq = pattern('single', color); sub = 'Point to look at in the edit'; break;
      case 'chapter': color = COL.white; seq = pattern('double', color); sub = 'YouTube chapter starts here'; break;
      case 'slate': color = COL.white; seq = pattern('strobe', color); sub = `Clap now. Press time ${hmsms(e.t)}`; break;
      case 'reset': color = COL.white; seq = pattern('long', color); sub = 'Start fresh: next KEEP ALL reaches back only to here'; break;
      case 'redo_take': color = COL.red; seq = pattern('long', color); sub = 'Previous take marked dead; next KEEP ALL starts here'; break;
      case 'need_broll': color = COL.magenta; seq = pattern('double', color); sub = 'Goes on the B-roll shot list'; break;
      case 'camera': color = COL.blue; seq = pattern('count', color, ' ABC'.indexOf(e.cam)); sub = `Switch to camera ${e.cam} here`; break;
      case 'cue': color = COL.cyan; seq = pattern('double', color); sub = e.cue === 'bleep' ? 'Bleep or mute the last 5 s' : 'Punch-in zoom here'; break;
      case 'take': color = COL.blue; seq = pattern('single', color); sub = `Scene ${e.scene}, take ${e.take}`; break;
      case 'note_mark': color = COL.blue; seq = pattern('double', color); sub = 'Voice note with no mark before it'; break;
      case 'tag': color = COL[e.tag] || COL.white; seq = pattern('single', color); sub = `ON · ${tgtName} is now ${tgt ? tagWords(tgt) : TAGS[e.tag]}`; break;
      case 'untag': color = COL[e.tag] || COL.white; seq = pattern('off', color); sub = `OFF · ${tgtName} is now ${tgt && tagWords(tgt) ? tagWords(tgt) : 'untagged'}`; break;

      case 'voice': color = COL.blue; seq = pattern('double', color); sub = `Saved on ${tgtName} (${durLong((e.end - e.start) / 1000)})`; break;
      case 'undo': color = COL.red; seq = pattern('double', color); sub = `Undid ${tgtName}`; break;
      case 'redo': color = COL.green; seq = pattern('double', color); sub = `Brought back ${tgtName}`; break;

    requestDraw();
  }

  // ======================================================================
  // Actions

  function doMark(type, st, gesture, extra = {}) {

  // Tag keys toggle (2.2.0): a tag the target doesn't have goes on, one it has comes off.

  function tagCheck(m, what) {

  }
  function rateOn(m, st) {   // 1 -> 2 -> 3 stars -> off

  function nextCamera() {

  // ======================================================================

  const KEYDEF = {

    T120: { type: 'time', secs: 120, label: '2 min' }, T300: { type: 'time', secs: 300, label: '5 min' }, T600: { type: 'time', secs: 600, label: '10 min' },
    KEEPALL: { type: 'keepall', label: 'KEEP ALL' }, FLAG: { type: 'flag', label: 'FLAG' }, NOTE: { type: 'note', label: 'NOTE' },
    BROLL: { type: 'tag', tag: 'broll', label: 'B-ROLL' }, SHORT: { type: 'tag', tag: 'short', label: 'SHORT' }, HIGHLIGHT: { type: 'tag', tag: 'highlight', label: 'HIGHLIGHT' },

  function markSub(id) {
    const d = KEYDEF[id];
    if (d.type === 'time') return 'hold: B-roll';
    if (d.type === 'keepall') return device === 'main' ? 'hold: MODE · 2 s: HIST' : 'hold: RESET';
    if (d.type === 'flag') return 'hold: chapter · 2 s: undo';

  }

  const COMBOS = {
    main: { 'FLAG+NOTE': 'lock', 'FLAG+KEEPALL': 'slate', 'KEEPALL+NOTE': 'light' },
    mini: { 'FLAG+NOTE': 'lock', 'FLAG+KEEPALL': 'slate' },
  };
  const comboOf = (a, b) => COMBOS[device][[a, b].sort().join('+')] || null;

  // MODE acts on the last mark, or on the highlighted one when MODE was entered from HISTORY
  const modeTarget = () => modeFrom === 'hist' ? histSel() : lastTaggable();
  const MODE_MAP = {
    T10: { label: 'SHORT VER', sub: 'tag on/off', tap: st => tagToggle(modeTarget(), 'shortver', st) },
    T30: { label: 'BLOOPER', sub: 'tag on/off', tap: st => tagToggle(modeTarget(), 'blooper', st) },
    T60: { label: 'SPONSOR', sub: 'tag on/off', tap: st => tagToggle(modeTarget(), 'sponsor', st) },
    BROLL: { label: 'RATE', sub: '1 → 2 → 3 → off', tap: st => rateOn(modeTarget(), st) },
    T120: { label: 'CAMERA', sub: 'next angle A/B/C', tap: st => doMark('camera', st, 'tap', { cam: nextCamera() }) },
    T300: { label: 'NEED B-ROLL', sub: 'shot list', tap: st => doMark('need_broll', st, 'tap') },
    T600: { label: 'ZOOM', sub: 'hold: BLEEP 5 s', tap: st => doMark('cue', st, 'tap', { cue: 'zoom' }), hold: st => doMark('cue', st, 'hold', { cue: 'bleep', secs: 5 }) },
    SHORT: { label: 'TAKE +1', sub: 'hold: SCENE +1', tap: st => { const s = sceneTake(); doMark('take', st, 'tap', { scene: s.sc, take: s.tk + 1 }); },
      hold: st => { const s = sceneTake(); doMark('take', st, 'hold', { scene: s.sc + 1, take: 1 }); } },
    KEEPALL: { label: 'RESET', sub: 'hold: back', tap: st => doMark('reset', st, 'tap'), hold: () => {} },

    HIGHLIGHT: { label: 'BACK', sub: 'hold: NEW SESSION', tap: () => {}, hold: () => { modeFrom = 'mark'; startNewSession(); } },

  const HIST_MAP = {

    T30: { label: '▲ UP', sub: 'newer', tap: () => histMove(-1), stay: true },
    T60: { label: 'TIME VIEW', sub: 'clock / since start', tap: () => { HIST.rel = !HIST.rel; }, stay: true },
    BROLL: { label: 'B-ROLL', sub: 'on/off highlighted', tap: st => tagToggle(histSel(), 'broll', st), stay: true },
    T120: { label: 'PAGE ▲', sub: '8 newer', tap: () => histMove(-HIST_ROWS), stay: true },
    T300: { label: '▼ DOWN', sub: 'older', tap: () => histMove(1), stay: true },
    T600: { label: 'PAGE ▼', sub: '8 older', tap: () => histMove(HIST_ROWS), stay: true },
    SHORT: { label: 'SHORT', sub: 'on/off highlighted', tap: st => tagToggle(histSel(), 'short', st), stay: true },
    KEEPALL: { label: 'EXIT', sub: 'hold: MODE on this mark', tap: () => {}, hold: () => enterMode('hist') },
    FLAG: { label: 'DELETE', sub: 'again: undo delete', tap: st => histDelete(st), stay: true },
    NOTE: { label: 'NOTE', sub: 'tap: play · hold: record', note: true, stay: true },
    HIGHLIGHT: { label: 'HIGHLIGHT', sub: 'on/off highlighted', tap: st => tagToggle(histSel(), 'highlight', st), stay: true },
  };

  let layer = 'mark';          // 'mark' | 'mode' | 'hist' (main only)
  let modeFrom = 'mark';       // where MODE returns to: 'mark' or 'hist'
  let locked = false;
  let modeTimer = null;
  const down = new Map();      // keyId -> press state
  const HIST = { selN: null, top: 0, rel: false };   // selN = number of the highlighted mark
  const HIST_ROWS = 8;
  const UNDO_MS = 2000, HIST_MS = 2000, LOCK_MS = 1500, MODE_TIMEOUT_MS = 8000;

  function buildKeys() {
    const k = $('keys'); k.innerHTML = '';
    for (const id of LAYOUT[device]) {
      const d = KEYDEF[id];
      const b = document.createElement('button');
      b.className = 'key ' + (d.type === 'tag' ? 'tag-' + d.tag : d.type);
      b.dataset.k = id;
      b.innerHTML = '<span class="kl"></span><span class="ks"></span>';

  }
  function relabel() {
    const map = layer === 'mode' ? MODE_MAP : layer === 'hist' ? HIST_MAP : null;
    for (const b of $('keys').children) {
      const id = b.dataset.k, alt = map && settings.relabel ? map[id] : null;
      b.classList.toggle('layer', !!alt);
      const label = alt ? alt.label : KEYDEF[id].label;
      const longest = Math.max(...label.split(' ').map(w => w.length));
      b.classList.toggle('m', longest === 6);
      b.classList.toggle('s', longest === 7);
      b.classList.toggle('xs', longest >= 8);

  const keyEl = id => $('keys').querySelector(`[data-k="${id}"]`);
  function clearTimers(st) { st.timers.forEach(clearTimeout); st.timers = []; }

  function setLayer(l) {

    if (l === 'mark') modeFrom = 'mark';
    if (was !== l && l === 'mark') { listSelN = null; }
    relabel(); requestDraw();
  }
  function enterMode(from = 'mark') {

    const tm = modeTarget();
    setLast('', from === 'hist' ? `MODE on #${tm ? tm.n : '?'}` : 'MODE', from === 'hist' ? 'Next key acts on the highlighted mark, then back to history' : 'Next key does its MODE job, then back to marking', COL.blue);
  }
  // HISTORY: hold KEEP ALL 2 s, tap a row in the list under the keys, the list's History button, or MODE then FLAG

  }

    if (!quiet) { haptic(15); const m = list[i]; setLast(m.n, `#${m.n} ${markLabel(m)}`, `${i + 1} of ${list.length} · ${h12(m.e.t, true)}${tagWords(m) ? ' · ' + tagWords(m) : ''}${m.live ? '' : m.deleted ? ' · DELETED' : ' · UNDONE'}`, COL.blue); }

  // Delete, or bring back a deleted / undone mark. Shared by HISTORY's FLAG, the list under the keys and the phone view.

  }
  function histPlay() {

    if (!m.voices.length) { errorFb(`NO VOICE ON #${m.n}`, 'Hold NOTE to record one on this mark'); return; }
    playVoice(m.voices[m.voices.length - 1]);

  }

  // ---------- first-time key hints (MODE, HISTORY) ----------
  let hintTimer = null;
  function showHint(kind, force) {
    if (!force && settings.hintsSeen?.[kind]) return;
    settings.hintsSeen = { ...(settings.hintsSeen || {}), [kind]: true }; saveSettings();
    const map = kind === 'mode' ? MODE_MAP : HIST_MAP;
    const cells = LAYOUT.main.map(id => `<td>${esc(map[id].label)}<i>${esc(map[id].sub || '')}</i></td>`);
    const rows = [0, 4, 8].map(i => `<tr>${cells.slice(i, i + 4).join('')}</tr>`).join('');
    const head = kind === 'mode'
      ? '<b class="h">MODE: the next key does this</b>Then it goes back (after 8 s by itself). From HISTORY, the tags and rating act on the highlighted mark.'
      : '<b class="h">HISTORY: browse and fix marks</b>▲ / ▼ move the highlight (also tap or swipe the list below, or swipe the screen). FLAG deletes, FLAG again undoes the delete. Tag keys turn tags on and off. KEEP ALL leaves.';
    const h = $('hint');
    h.innerHTML = `${head}<table>${rows}</table><div class="x">Keys under this card still work · it goes after 12 s or a tap off the keys · shown once · Help has it all</div>`;

  // ---------- press engine ----------
  function onDown(id, t, pid) {
    if (down.has(id)) return;
    const st = { id, t, pid, timers: [], layer, consumed: false, fired: false, armed: false, used: false, withTags: [], rec: null, others: false };
    // Tap rule (2.2.0): a tap is press-and-release with no other key pressed while it was down.
    // Any key already down, or pressed later, marks both presses as "others".
    for (const o of down.values()) { o.others = true; st.others = true; }

    // two keys together?
    const other = [...down.values()].find(o => o !== st && !o.consumed && !o.fired && comboOf(o.id, id));

  // The old app's exact CSV columns
  function legacyCsv(list, names) {
    const cols = ['session', 'session_name', 'seq', 'epoch_ms', 'local_time', 'utc_time', 'tz_offset_min', 'button', 'gesture', 'action', 'undone', 'cleared', 'note'];
    const val = (e, c) => c === 'session_name' ? (names[e.session] || prettyId(e.session)) : c === 'cleared' ? (e.cleared || []).join(' ') : e[c];
    return [cols.join(','), ...list.map(e => cols.map(c => csvCell(val(e, c))).join(','))].join('\n') + '\n';
  }

  // ======================================================================
  // Export: CSV of marks (one row per mark, final state), CSV of every
  // action, voice-note CSV, full JSON, and a ZIP with all of it plus audio.
  // ======================================================================
  const csvCell = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = (cols, rows) => [cols.join(','), ...rows.map(r => cols.map(c => csvCell(r[c])).join(','))].join('\n') + '\n';
  const MARK_COLS = ['session', 'session_name', 'n', 'device', 'key', 'gesture', 'kind', 'label', 'epoch_ms', 'local_time', 'utc_time', 'tz_offset_min',
    'window_s', 'from_epoch_ms', 'from_local_time', 'covers_s', 'from_mark', 'tags', 'rating', 'camera', 'cue', 'scene', 'take', 'voice_files', 'text', 'kept', 'undone', 'deleted'];
  function markRows(id) {
    const d = derive(id); cache = null;
    return d.marks.map(m => {
      const e = m.e;
      return { session: id, session_name: sessionName(id), n: m.n, device: e.dev, key: e.key, gesture: e.g, kind: e.type, label: markLabel(m),
        epoch_ms: e.t, local_time: localIso(e.t), utc_time: new Date(e.t).toISOString(), tz_offset_min: -new Date(e.t).getTimezoneOffset(),
        window_s: e.secs ?? '', from_epoch_ms: m.from ?? '', from_local_time: m.from != null ? localIso(m.from) : '', covers_s: m.from != null ? ((m.to - m.from) / 1000).toFixed(3) : '',
        from_mark: m.fromN ?? '', tags: m.tags.join(' '), rating: m.rating || '', camera: e.cam || '', cue: e.cue || '', scene: e.scene ?? '', take: e.take ?? '',
        voice_files: m.voices.map(v => v.file).join(' '), text: m.texts.join(' | '), kept: m.kept ? 1 : 0, undone: m.undone ? 1 : 0, deleted: m.deleted ? 1 : 0 };
    });
  }
  const ACT_COLS = ['session', 'n', 'epoch_ms', 'local_time', 'device', 'key', 'gesture', 'type', 'label', 'target', 'detail', 'undone', 'deleted'];
  function actionRows(id) {
    const d = derive(id); cache = null;
    return d.list.map(e => ({ session: id, n: e.n, epoch_ms: e.t, local_time: localIso(e.t), device: e.dev, key: e.key, gesture: e.g, type: e.type,
      label: markLabel(d.mByN.get(e.n) || e).replace(/−/g, '-'), target: e.target ?? '',
      detail: (e.type === 'untag' ? 'off ' : '') + (e.tag || e.text || (e.rating ? e.rating + ' stars' : e.type === 'rate' ? 'rating off' : '') || e.file || ''),
      undone: d.undone.has(e.n) ? 1 : 0, deleted: d.deleted.has(e.n) ? 1 : 0 }));
  }
  const VOICE_COLS = ['session', 'n', 'on_mark', 'file', 'press_epoch_ms', 'start_epoch_ms', 'end_epoch_ms', 'start_local_time', 'end_local_time', 'duration_s', 'mime', 'sample_rate', 'bytes', 'undone', 'deleted'];
  function voiceRows(id) {
    const d = derive(id); cache = null;
    return d.list.filter(e => e.type === 'voice').map(e => ({ session: id, n: e.n, on_mark: e.target, file: e.file, press_epoch_ms: e.t, start_epoch_ms: e.start, end_epoch_ms: e.end,
      start_local_time: localIso(e.start), end_local_time: localIso(e.end), duration_s: ((e.end - e.start) / 1000).toFixed(3), mime: e.mime, sample_rate: e.rate || '', bytes: e.bytes,
      undone: d.undone.has(e.n) ? 1 : 0, deleted: d.deleted.has(e.n) ? 1 : 0 }));
  }
  function jsonExport(ids) {
    return JSON.stringify({ format: 'editless-phone-log', version: 2, app_version: VERSION, exported_at: localIso(Date.now()),
      notes: 'events = every numbered action in order; marks = final state worked out from them (undo, delete, tags applied). Times are epoch ms (UTC) plus local ISO.',
      sessions: ids.map(id => ({ id, name: sessionName(id), created: sessions[id]?.created ?? null, events: events.filter(e => e.s === id), marks: markRows(id) })) }, null, 1);
  }
  const enc = new TextEncoder();
  async function exportZip(ids) {
    const files = [];
    const tag = ids.length === 1 ? ids[0] + (sessions[ids[0]]?.name ? '_' + slug(sessions[ids[0]].name) : '') : 'all_' + newSessionId();
    for (const id of ids) {
      const pre = ids.length === 1 ? '' : id + '/';
      files.push({ name: `${pre}marks.csv`, data: enc.encode(csv(MARK_COLS, markRows(id))) });
      files.push({ name: `${pre}actions.csv`, data: enc.encode(csv(ACT_COLS, actionRows(id))) });
      const vr = voiceRows(id);
      if (vr.length) files.push({ name: `${pre}voice_notes.csv`, data: enc.encode(csv(VOICE_COLS, vr)) });
      for (const e of events.filter(x => x.s === id && x.type === 'voice')) {
        try { const r = await idbGet(e.audio); if (r) files.push({ name: `${pre}voice/${e.file}`, data: new Uint8Array(await r.blob.arrayBuffer()), t: e.start }); } catch { /* skip */ }
      }
    }
    files.push({ name: 'editless.json', data: enc.encode(jsonExport(ids)) });
    await shareOrDownload([new File([zip(files)], `editless_${tag}.zip`, { type: 'application/zip' })]);
  }
  const slug = s => s.replace(/[^\w-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);

  // Minimal ZIP writer (no compression), so no library is needed.
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zip(files) {
    const parts = [], central = []; let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name), data = f.data, crc = crc32(data);
      const d = new Date(f.t || Date.now());
      const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
      const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
      ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
      ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + data.length;
    }
    const cdSize = central.reduce((a, p) => a + p.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
  }

  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  async function shareOrDownload(files) {
    try {
      if (navigator.canShare?.({ files })) { await navigator.share({ files, title: files[0].name }); return; }
    } catch (err) { if (err && err.name === 'AbortError') return; }
    for (const f of files) downloadBlob(f, f.name);
  }

    const sw = c => `<span class="sw" style="background:${c}"></span>`;
    body.innerHTML = `

      <p>A stand-in for the planned hardware remotes, to try the controls before the boards exist. Marks are logged with the phone's clock to the millisecond, at the moment a key goes <i>down</i>.</p>

      <h3>Two views: Remote and Phone (2.3.0)</h3>
      <p>The <b>Remote / Phone</b> switch at the top changes between the <b>Remote</b> view (the simulated keys, e-paper screen and lights) and the <b>Phone</b> view (a normal one-handed phone layout). Both are the same app over the same data: the same session, marks, tags, ratings, voice and text notes and settings. Whatever you do in one is in the other at once, and you can switch at any time. The app opens in the view you used last. A voice note being recorded when you switch (or open the menu) is stopped and saved first.</p>

      <p>Actions made in the phone view are logged with device <b>phone</b> and key <b>PHONE</b>, so the exports show where each came from. The computer keyboard keys and the key lock only work in the Remote view. The light and dark setting of the phone is followed by the Phone view; the menu stays dark.</p>

      <b>Fixing:</b> FLAG deletes the highlighted mark; FLAG again undoes the delete (an undone mark comes back the same way). B-ROLL, SHORT and HIGHLIGHT turn tags on and off. NOTE tap plays its newest voice note, NOTE hold records a new one on it. Hold KEEP ALL for MODE on the highlighted mark (short version, blooper, sponsor, rating), then you are back in history.<br>

      ${keyTable(LAYOUT.main, 4, lay(HIST_MAP))}

      ${keyTable(LAYOUT.mini, 1, miniCell)}
      <p>Combos: KEEP ALL + FLAG = SLATE; FLAG + NOTE held 1.5 s = lock. The mini has no MODE, history or side light. On the phone, the line under the keys shows what happened and the list under it has every mark (tap one to delete it or change its tags); the real mini only has its lights.</p>

      <h3>Status light colours</h3>
      <p>${sw(COL.keep)}keep (one flash; KEEP ALL long) · ${sw(COL.broll)}B-roll · ${sw(COL.short)}SHORT · ${sw(COL.highlight)}HIGHLIGHT / SPONSOR · ${sw(COL.shortver)}SHORT VER · ${sw(COL.blooper)}BLOOPER · ${sw('#fff')}flag (chapter: double, slate: strobe, reset: long) · ${sw(COL.red)}undo (double), redo take (long), pulsing while recording · ${sw(COL.green)}redo (double), rating (one flash per star) · ${sw(COL.blue)}MODE, take, voice note saved, camera (one flash per letter) · ${sw(COL.cyan)}zoom / bleep cue · ${sw(COL.orange)}error (nothing to undo or tag). A tag taken off: a long then a short flash in its colour.

      <h3>The screen (main)</h3>

      <h3>Simulated here</h3>

      <li>Battery-type setting and the real cell level; USB drive with the log file; firmware updates; supercapacitor or coin-cell reserve; wet-port check</li>
      <li>The real microphone's tone and its place in the case, wind and handling noise, and the chip converter's real accuracy (the preview only imitates rate, bits, clipping, hiss and compression); clap detection</li>
      <li>Sleep, wake on the first press (on the remote the first press only wakes it), e-paper temperature limits</li></ul>

      <h3>Assumptions (Claude's, 2026-11-16, not the owner's decisions)</h3>
      <ul>
      <li><b>12-key map.</b> Decided in the notes: six time keys (10 s, 30 s, 1, 2, 5, 10 min), KEEP ALL with MODE on its hold, FLAG with tap = flag, hold = chapter, 2 s hold = undo, tag keys that act on the last mark, stack, and work held while pressing another key. The notes' 12-key list (2026-11-13) has four tag keys (B-roll, Short, Short version, Highlight) and no NOTE key; the later 9-key proposal (2026-11-15, not chosen) adds NOTE (hold = voice note, tap = redo take). Here the 12 keys are that 9-key proposal plus a fourth column of three tag keys (B-ROLL, SHORT, HIGHLIGHT), and SHORT VER moves into MODE. Positions are my guess.</li>
      <li>Time keys keep hold = same window as B-roll, as on the prototype.</li>

      <li>Voice notes are push-to-talk (recording while NOTE is held), on the mark that was last when NOTE went down. Recording starts at the press so the first words are kept; a release before the hold time throws it away and counts as REDO TAKE.</li>
      <li>KEEP ALL reaches back to the latest live keep, KEEP ALL, RESET or REDO TAKE, or the session start. Flags, chapters, slates and MODE marks do not move that point (the prototype rule was "every press except SYNC", before flags existed).</li>
      <li>REDO TAKE marks the stretch since that same point as a dead take and starts a new one.</li>
      <li>Mini key order and jobs (30 s, 2 min, KEEP ALL with hold = RESET, B-ROLL, FLAG, NOTE) are mine; the notes only fix 6 keys in a row.</li>
      <li>Status light colours and flash patterns are mine, built from the old plan's colours.</li>
      <li>Rating cycles 1, 2, 3 stars on the last mark; camera cycles B, C, A.</li>
      </ul>

      <h3>Running it on the phone</h3>
      <p>The microphone only works on a secure page: <b>https://</b> or <b>http://localhost</b>. A plain http:// address on the home network loads the app but cannot record. Steps are in START-HERE.md in the project folder. Once opened from localhost and installed (Chrome menu → Add to Home screen / Install app), it runs offline.</p>
      <p class="mono">Storage: marks in localStorage (editless.v2.*), audio in IndexedDB "editless". The old app's data (editless.*.v1) is left untouched and listed under Sessions. Keyboard on a computer: main 1 2 3 4 / q w e r / a s d f, mini 1 to 6.</p>`;
  }

  // ======================================================================
  // Remote sound preview (2.1.0). Plays a recording through a simulation of
  // the remote's recording chain: microphone hiss and limit, amplifier,
  // the two converter paths, sample rate, bit depth and storage format.
  // The stored original is never changed; nothing new is saved on the phone.
  // ======================================================================
  const DSP_SRC = $('dspSrc').textContent;
  const DSP = new Function(DSP_SRC + '\nreturn DSP;')();
  const PV_LEVELS = [[74, 'Quiet talking, 10 cm'], [82, 'Normal talking, 10 cm'], [72, 'Normal talking, 30 cm'],
    [88, 'Raised voice, 10 cm'], [102, 'Shouting, 10 cm'], [105, 'Very loud place (club, concert)']];
  const PV_BOARD = { fs: 16000, conv: '12/11', path: 'both', amp: 'mcp6002', micNoise: true, oversample: true, aa: true, store: 'raw16', bypass: false };
  const PV_PRESETS = {
    board: { label: 'Board as designed', sub: '16 kHz, 12-bit, two paths raw', p: { ...PV_BOARD } },
    orig: { label: 'Original plan', sub: '16 kHz ADPCM, one path', p: { ...PV_BOARD, path: 'amp', amp: 'lmv321', oversample: false, store: 'adpcm' } },
    k32: { label: '32 kHz', sub: 'board at 32 kHz', p: { ...PV_BOARD, fs: 32000 } },
    k48: { label: '48 kHz', sub: 'board at 48 kHz', p: { ...PV_BOARD, fs: 48000 } },
    phone: { label: 'Phone original', sub: 'no simulation', p: { ...PV_BOARD, bypass: true } },
  };
  const PV_OPTS = {
    fs: [[8000, '8 kHz'], [16000, '16 kHz ★'], [24000, '24 kHz'], [32000, '32 kHz'], [48000, '48 kHz']],
    aa: [[true, 'Proper low-pass filter ★'], [false, 'None: hear aliasing']],
    oversample: [[true, '95.2 kHz, filtered down ★'], [false, 'Sample directly at the rate']],
    conv: [['12/9', '12-bit, 9 effective'], ['12/10', '12-bit, 10 effective'], ['12/11', '12-bit, 11 effective ★'], ['12/12', '12-bit, ideal'], ['16/16', '16-bit, ideal'], ['24/24', '24-bit, ideal']],
    path: [['both', 'Both paths combined ★'], ['amp', 'Amplified only'], ['raw', 'Unamplified only']],
    amp: Object.entries(DSP.AMPS).map(([k, a]) => [k, a.label + (k === 'mcp6002' ? ' ★' : '')]),
    micNoise: [[true, 'On ★'], [false, 'Off']],
    store: [['raw16', 'Raw 16-bit ★'], ['pack12', '12-bit packed'], ['adpcm', 'IMA ADPCM 4-bit']],
  };
  const PV_LABELS = { fs: 'Sample rate per channel', aa: 'Anti-alias filter', oversample: 'Converter sampling', conv: 'Converter resolution',
    path: 'Gain path', amp: 'Amplifier (bandwidth and hiss)', micNoise: 'Microphone hiss (65 dB SNR)', store: 'Storage format' };
  const PV = { p: { ...PV_BOARD }, level: 82, src: null, fs0: 0, name: '', base: 'editless', blob: null, ext: 'wav', meas: null,
    res: null, runId: 0, worker: null, workerBusy: false, noWorker: false, workerUrl: null, timer: null,
    ctx: null, bufA: null, bufB: null, bufBres: null, A: null, B: null, playing: false, t0: 0, pos: 0, ab: 'B', rec: null, waveImg: null };

  const f1 = x => (Math.round(x * 10) / 10).toFixed(1);
  const fmtMin = m => m < 1 ? `${Math.round(m * 60)} s` : m < 120 ? `${m < 10 ? f1(m) : Math.round(m)} min` : m < 2880 ? `${m < 600 ? f1(m / 60) : Math.round(m / 60)} h` : `${Math.round(m / 1440)} days`;
  const pvK = () => PV.meas && PV.meas.active > 0 ? 20e-6 * 10 ** (PV.level / 20) / PV.meas.active : 1;
  const pvDur = () => PV.src ? PV.src.length / PV.fs0 : 0;

  async function openPreview(e) {
    stopAudio();
    $('pv').classList.add('show');
    pvRender();
    if (!e) return;
    try {
      const r = await idbGet(e.audio);
      if (!r) { toast('Audio missing', 'It was deleted or never stored', true); return; }
      await pvLoadBlob(r.blob, `#${e.n} ${e.file}`, e.file.replace(/\.\w+$/, ''), extFor(r.mime || ''));
    } catch (err) { toast('Cannot open the note', err.message || String(err), true, 3500); }
  }
  function closePreview() {
    pvStopPlay();
    if (PV.rec) { const h = PV.rec; PV.rec = null; discardRec(h); }
    $('pv').classList.remove('show');
  }
  $('pvClose').addEventListener('click', closePreview);

  async function pvLoadBlob(blob, name, base, ext) {
    pvStopPlay();
    const ab = await blob.arrayBuffer();
    let dec = DSP.parseWav(ab);
    if (!dec) {   // compressed notes (MediaRecorder) and other files: let the browser decode them
      const oc = new OfflineAudioContext(1, 1, 48000);
      const b = await oc.decodeAudioData(ab.slice(0));
      const data = new Float32Array(b.length);
      for (let c = 0; c < b.numberOfChannels; c++) { const ch = b.getChannelData(c); for (let i = 0; i < b.length; i++) data[i] += ch[i] / b.numberOfChannels; }
      dec = { fs: b.sampleRate, data };
    }
    if (!dec.data.length) throw new Error('The recording is empty');
    Object.assign(PV, { src: dec.data, fs0: dec.fs, name, base: base || 'editless', blob, ext: ext || 'wav', meas: DSP.measure(dec.data, dec.fs), res: null, bufA: null, bufB: null, bufBres: null, pos: 0 });
    if (!(PV.meas.active > 0)) toast('This recording is silent', 'Nothing to compare', true, 3000);
    pvRender();
    pvProcess();
  }

  // ---------- processing (Worker made from a Blob; main thread in small steps if Workers fail) ----------
  function pvSchedule() { clearTimeout(PV.timer); PV.timer = setTimeout(pvProcess, 200); pvNums(); }
  function pvProcess() {
    pvNums();
    if (!PV.src) return;
    const id = ++PV.runId;
    if (PV.p.bypass) { pvProg(1); pvDone({ out: PV.src, flags: new Uint8Array(PV.src.length), fs: PV.fs0, stats: { bypass: true } }); return; }
    const p = { ...PV.p, k: pvK(), seed: 20261116 };
    pvProg(0.001);
    if (!PV.noWorker && typeof Worker !== 'undefined') {
      try {
        if (PV.worker && PV.workerBusy) { PV.worker.terminate(); PV.worker = null; }
        if (!PV.worker) {
          PV.workerUrl = PV.workerUrl || URL.createObjectURL(new Blob([DSP_SRC], { type: 'text/javascript' }));
          PV.worker = new Worker(PV.workerUrl);
          PV.worker.onmessage = pvMsg;
          PV.worker.onerror = ev => { ev.preventDefault?.(); PV.noWorker = true; PV.worker = null; PV.workerBusy = false; pvProcess(); };
        }
        PV.workerBusy = true;
        PV.worker.postMessage({ id, src: PV.src, fs0: PV.fs0, p });
        return;
      } catch { PV.noWorker = true; }
    }
    const it = DSP.run(PV.src, PV.fs0, p);
    const step = () => {
      if (id !== PV.runId) return;
      const t = performance.now(); let r;
      try { do { r = it.next(); } while (!r.done && performance.now() - t < 25); }
      catch (err) { toast('Preview failed', err.message || String(err), true, 4000); pvProg(0); return; }
      if (r.done) pvDone(r.value); else { pvProg(r.value); setTimeout(step, 0); }
    };
    step();
  }
  function pvMsg(ev) {
    const d = ev.data;
    if (d.id !== PV.runId) return;
    if (d.progress != null) { pvProg(d.progress); return; }
    PV.workerBusy = false;
    if (d.error) { toast('Preview failed', d.error, true, 4000); pvProg(0); return; }
    pvDone(d.res);
  }
  function pvProg(v) { const el = $('pvProg'); if (el) { el.style.width = `${Math.round(v * 100)}%`; el.style.background = v >= 1 ? 'var(--keep)' : 'var(--blue)'; } }
  function pvDone(res) {
    PV.res = res; pvProg(1);
    pvDraw(); pvStats();
    if (PV.playing) pvPlay(pvPos());
  }

  // ---------- playback: original and simulation run together; A/B only swaps which one is heard ----------
  function pvBuf(c, data, fs) { const b = c.createBuffer(1, data.length, fs); b.copyToChannel(data, 0); return b; }
  function pvPos() { return PV.playing && PV.ctx ? Math.max(0, Math.min(pvDur(), PV.ctx.currentTime - PV.t0)) : PV.pos; }
  function pvPlay(at = 0) {
    if (!PV.src || !PV.res) { toast(PV.src ? 'Still working…' : 'Load or record a clip first'); return; }
    pvStopPlay(); stopAudio();
    try {
      if (!PV.ctx || PV.ctx.state === 'closed') { PV.ctx = new AudioContext(); PV.bufA = null; PV.bufB = null; }
      const c = PV.ctx; c.resume().catch(() => {});
      if (!PV.bufA) PV.bufA = pvBuf(c, PV.src, PV.fs0);
      if (!PV.bufB || PV.bufBres !== PV.res) { PV.bufB = pvBuf(c, PV.res.out, PV.res.fs); PV.bufBres = PV.res; }
      if (at >= pvDur() - 0.05) at = 0;
      const t0 = c.currentTime + 0.04;
      const mk = (buf, on) => { const s = c.createBufferSource(), g = c.createGain(); s.buffer = buf; g.gain.value = on ? 1 : 0; s.connect(g); g.connect(c.destination); s.start(t0, Math.min(at, buf.duration)); return { s, g }; };
      const A = mk(PV.bufA, PV.ab === 'A'), B = mk(PV.bufB, PV.ab === 'B');
      Object.assign(PV, { A, B, t0: t0 - at, playing: true });
      A.s.onended = () => { if (PV.A === A) { PV.pos = 0; pvStopPlay(); PV.pos = 0; pvHead(); } };
      $('pvPlay').textContent = 'Stop';
      requestAnimationFrame(pvTick);
    } catch (err) { toast('Cannot play', err.message || String(err), true, 3000); }
  }
  function pvStopPlay() {
    if (!PV.playing) return;
    PV.pos = pvPos();
    const { A, B } = PV; PV.A = PV.B = null; PV.playing = false;
    for (const x of [A, B]) { try { x?.s.stop(); } catch { /* already stopped */ } }
    if ($('pvPlay')) $('pvPlay').textContent = 'Play';
  }
  function pvSetAB(ab) {
    PV.ab = ab;
    for (const b of $('pvAB').children) b.classList.toggle('on', b.dataset.ab === ab);
    if (PV.playing && PV.ctx) {
      const now = PV.ctx.currentTime;
      PV.A.g.gain.setTargetAtTime(ab === 'A' ? 1 : 0, now, 0.004);
      PV.B.g.gain.setTargetAtTime(ab === 'B' ? 1 : 0, now, 0.004);
    }
    haptic(15);
  }
  $('pvPlay').addEventListener('click', () => { if (PV.playing) pvStopPlay(); else pvPlay(PV.pos); });
  $('pvAB').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) pvSetAB(b.dataset.ab); });
  function pvTick() { pvHead(); if (PV.playing) requestAnimationFrame(pvTick); }

  // ---------- waveform: original (grey), simulation (blue), clipping (red), unamplified path in use (amber) ----------
  function pvDraw() {
    const cv = $('pvWave'); if (!cv) return;
    const W = Math.max(100, cv.clientWidth || 300), H = 140, dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = '#0f1116'; g.fillRect(0, 0, W, H);
    if (!PV.src) { g.fillStyle = '#a7adb8'; g.font = '13px system-ui, sans-serif'; g.textAlign = 'center'; g.fillText('No clip loaded', W / 2, H / 2 + 4); PV.waveImg = null; return; }
    const res = PV.res, mid = H / 2, kS = pvK() * DSP.HW.micSens, half = DSP.HW.adcHalf;
    const G = DSP.AMPS[PV.p.amp].gain, clipU = half / G / kS;
    const top = Math.max(PV.meas.peak, 1e-6) * 1.15, sy = v => mid - Math.max(-1.05, Math.min(1.05, v / top)) * (mid - 3);
    const env = (x, n, col) => {
      g.fillStyle = col;
      for (let px = 0; px < W; px++) {
        const a = Math.floor(px * n / W), b = Math.max(a + 1, Math.floor((px + 1) * n / W)); let lo = 0, hi = 0;
        for (let i = a; i < b && i < n; i++) { const v = x[i]; if (v < lo) lo = v; else if (v > hi) hi = v; }

    if (res && !res.stats.bypass) env(res.out, res.out.length, 'rgba(96,165,250,.8)');

      <h3>What this can and cannot tell you</h3>
      <p><b>It imitates:</b> the sample rate (with a proper filter, or without one so you hear aliasing); the converter's bit depth and its noise, measured against the converter's full scale, so quiet speech really uses few bits; clipping of the amplified path and the switch to the unamplified one; the microphone's own hiss; the amplifier's hiss and bandwidth; and the storage format, including real IMA ADPCM encoding and decoding.</p>
      <p><b>It cannot imitate:</b> the real microphone's tone (you hear the phone's microphone with the remote's limits added); the microphone's place in the case, its sound hole and any resonance; wind, handling and key-click noise; electrical noise from the radio, regulators or screen; the CH585 converter's real accuracy, which is not published (no effective bits, noise or linearity figures), so "effective bits" is a guess to try; and the phone's own hiss, which stays in the recording, so this can add the remote's flaws but never remove the phone's. Levels rest on your loudness estimate above.</p>
      <h3>Where the numbers come from</h3>
      <ul>
      <li>Microphone ZTS6216: -38 dBV/Pa, 65 dB(A) signal-to-noise = 29 dB(A) SPL of hiss (data sheet p.3, research\\audio-chain.md); limit 125 dB SPL (research file), simulated as a hard clip. Hiss is simulated as flat noise of 61 nV/√Hz (7.08 µV over 13.5 kHz, the bandwidth that reproduces the research file's amplifier losses): my assumption.</li>
      <li>Amplifier ★ MCP6002, two stages of 6.1 = gain 37.2, 28 nV/√Hz, about 164 kHz per stage (board\\circuit.py, fifth pass; not yet written up in PART-NOTES). LMV321 gain 40, 46 nV/√Hz, 25 kHz; TLV9061 gain 40, 16 nV/√Hz, 250 kHz (research file). Hiss added: MCP6002 about 0.85 dB (my arithmetic, same method), LMV321 1.95 dB, TLV9061 0.32 dB.</li>
      <li>Converter: CH585 12-bit, 0 to 2.1 V range, input biased at about 1.0 V (data sheet ch.15, circuit.py), so it clips about 1.05 V either side (taken as symmetric). Effective bits are not published; ★ 11 is a guess (research file: real chip converters usually manage 10 to 11).</li>
      <li>Clip points: amplified path ${f1(DSP.numbers({ ...PV_BOARD, path: 'amp' }).clipAmp)} dB SPL with gain 37.2, 97.4 with gain 40 (research file); unamplified 129 dB, but the microphone itself stops at 125.</li>
      <li>Sampling ★: both channels scanned at about 95.2 kHz each, then filtered down to 48, 32 or 16 kHz in firmware (circuit.py); simulated at 96 kHz. This spreads the converter's noise over a wider band, so less of it lands in the speech band. "Sample directly" turns that off. The 32.9 kHz RC in front of each pin is included, uncorrected.</li>
      <li>Both paths combined: the amplified path is used unless it comes within 1 dB of clipping; then the unamplified one, scaled to match, for at least 30 ms, with a 2 ms crossfade. That rule is my assumption of what the computer software would do.</li>
      <li>Storage: 16 MB = the ZD25Q128C chip, 128 MB = the FLSD01G chip, 32 GB = a microSD card (PART-NOTES storage tables). MB here are 1,048,576 bytes; 32 GB is 32 × 10<sup>9</sup> bytes. Nothing is set aside for the mark log or a file system. ADPCM is 4 bits a sample; real files add about 1 % of block headers.</li>
      <li>Talking levels: normal speech is about 62 dB SPL at 1 m, raised 68, loud 75, shouted 82 (general figures in the style of ANSI S3.5); about 20 dB more at 10 cm. Very loud places 100 to 110 dB. The level is the average while sound is present (20 ms pieces within 25 dB of the loudest).</li>
