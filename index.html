        if (m.live && !NOT_TAGGABLE.has(m.e.type)) {
          for (const t of PHONE_TAGS) { const on = m.tags.includes(t); h += `<button class="pb${on ? ' on' : ''}" data-a="tag" data-tag="${t}" aria-pressed="${on}">${on ? '✓ ' : '+ '}${TAGS[t]}</button>`; }
          h += `<button class="pb${m.rating ? ' on' : ''}" data-a="rate">${m.rating ? 'RATED ' + m.rating + '★' : 'RATE'}<small>${m.rating >= 3 ? 'tap: off' : `tap: ${m.rating + 1}★`}</small></button>`;
        }
        if (m.live) h += `<button class="pb note${recNow && pRec.rowN === m.n ? ' rec' : ''}" data-hold="note" data-n="${m.n}">RECORD<small>hold to talk</small></button>`;
        if (m.voices.length) h += '<button class="pb" data-a="pv">HEAR ON REMOTE</button>';
        h += '<button class="pb" data-a="text">ADD TEXT</button>';
        h += `<button class="pb${m.live ? ' danger' : ''}" data-a="del">${m.deleted ? 'UNDO DELETE' : m.undone ? 'BRING BACK' : 'DELETE'}</button>`;
        h += '<button class="pb" data-a="close">CLOSE</button></div>';
      }
      h += '</div>';
    }
    const el = $('pList'), keep = el.scrollTop;
    el.innerHTML = h; el.scrollTop = keep;
    if (phoneScrollSel) { phoneScrollSel = false; el.querySelector('.pr.sel')?.scrollIntoView({ block: 'nearest' }); }
  }

  function phoneAct(act, b, st) {
    const tgt = pTarget(), inMore = !!b.closest('#pMore');
    switch (act) {
      case 'mark': { const w = settings.phoneWin; phoneSel = null; if (w === 'all') doMark('keepall', st, 'tap'); else doMark('keep', st, 'tap', { secs: +w }); break; }
      case 'flag': phoneSel = null; doMark('flag', st, 'tap'); break;
      case 'tag': case 'mtag': tagToggle(tgt, b.dataset.tag, st); break;
      case 'undo': doUndo(st, 'tap'); break;
      case 'more': openMore(); return;
      case 'closeMore': closeMore(); return;
      case 'chapter': case 'reset': case 'redo_take': case 'need_broll': phoneSel = null; doMark(act, st, 'tap'); break;
      case 'slate': phoneSel = null; slate(st); toast(`SLATE ${hmsms(st.t)}`, 'Clap now', false, 2500); break;
      case 'camera': phoneSel = null; doMark('camera', st, 'tap', { cam: nextCamera() }); break;
      case 'zoom': phoneSel = null; doMark('cue', st, 'tap', { cue: 'zoom' }); break;
      case 'bleep': phoneSel = null; doMark('cue', st, 'tap', { cue: 'bleep', secs: 5 }); break;
      case 'take': { const s = sceneTake(); phoneSel = null; doMark('take', st, 'tap', { scene: s.sc, take: s.tk + 1 }); break; }
      case 'scene': { const s = sceneTake(); phoneSel = null; doMark('take', st, 'tap', { scene: s.sc + 1, take: 1 }); break; }
      case 'rate': rateOn(tgt, st); break;
      case 'redo': doRedo(st); break;
      case 'text': if (!tgt) errorFb('NOTHING TO NOTE', 'Make a mark first'); else addTextNote(tgt, 'PHONE'); break;
      case 'newSession': { const name = prompt('Name this session (optional):', ''); if (name === null) return; phoneSel = null; startNewSession(name.trim()); break; }
      case 'clock': closeMore(); showClock(); return;
      default: if (act.startsWith('tab:')) { openSheet(act.slice(4)); return; }
    }
    if (inMore) closeMore();
    requestDraw();
  }

  function openMore() {
    const tgt = pTarget(), s = sceneTake();
    const B = (act, label, sub = '', extra = '') => `<button class="pb" data-act="${act}" ${extra}>${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ''}</button>`;
    $('pMoreCard').innerHTML = `<div class="head"><b>More</b><button class="pb" data-act="closeMore" style="min-width:96px">Close</button></div>
      <h4>Mark now</h4><div class="grid">
        ${B('chapter', 'CHAPTER', 'YouTube chapter')}${B('slate', 'SLATE', 'clap now')}${B('camera', 'CAMERA ' + nextCamera(), 'next angle')}
        ${B('take', 'TAKE +1', `now SC${s.sc} TK${s.tk}`)}${B('scene', 'SCENE +1', `SC${s.sc + 1} TK1`)}${B('need_broll', 'NEED B-ROLL', 'shot list')}
        ${B('zoom', 'ZOOM', 'punch-in cue')}${B('bleep', 'BLEEP 5 s', 'mute cue')}${B('reset', 'RESET', 'KEEP ALL starts here')}
        ${B('redo_take', 'REDO TAKE', 'last take is dead')}</div>
      <h4>${tgt ? `On #${tgt.n} ${esc(markLabel(tgt))}` : 'On the last mark (none yet)'}</h4><div class="grid">
        ${['shortver', 'blooper', 'sponsor'].map(t => B('mtag', (tgt && tgt.tags.includes(t) ? '✓ ' : '+ ') + TAGS[t], 'on / off', `data-tag="${t}"`)).join('')}
        ${B('rate', tgt && tgt.rating ? `RATE ${tgt.rating}★` : 'RATE', '1 → 2 → 3 → off')}${B('text', 'ADD TEXT', 'typed note')}${B('redo', 'REDO', 'bring back undo')}</div>
      <h4>Session and app</h4><div class="grid">
        ${B('newSession', 'NEW SESSION')}${B('tab:sessions', 'SESSIONS')}${B('tab:log', 'FULL LOG')}
        ${B('tab:voice', 'VOICE', 'mic · sound preview')}${B('tab:export', 'EXPORT')}${B('tab:settings', 'SETTINGS')}
        ${B('tab:help', 'HELP')}${B('clock', 'CLOCK', 'ms, to film')}</div>`;
    $('pMore').classList.add('show');
    $('pMoreCard').scrollTop = 0;
  }
  function closeMore() { $('pMore').classList.remove('show'); }

  // NOTE: hold to record, as on the remote (recording starts at the press, counts after the hold time, release saves)
  function phoneNoteDown(btn, pid) {
    if (pRec) return;
    releaseAll();
    const rowN = btn.dataset.n != null ? +btn.dataset.n : null;
    const target = rowN != null ? derive().mByN.get(rowN) : pTarget();
    const st = { id: 'PHONE', t: Date.now(), pid, timers: [], rec: null, armed: false, rowN };
    pRec = st;
    btn.classList.add('down');
    stopAudio();
    noteDown(st, target, 250);       // phone view: a tap does nothing else, so arm after 0.25 s
    st.btn = btn; st.live = false;
    requestAnimationFrame(pMeterLoop);
  }
  // While NOTE is held: amber "wait" until the mic is really delivering sound, then red with a live level bar.
  function pMeterLoop() {
    const st = pRec, box = $('pStatus'), lv = $('pLevel');
    if (!st) { box.classList.remove('wait'); lv.hidden = true; for (const b of document.querySelectorAll('#phone .wait')) b.classList.remove('wait'); return; }
    const h = st.rec, live = !!(h && h.ok && h.start != null);
    if (live && !st.live) { st.live = true; haptic(40); }
    box.classList.toggle('wait', !live); st.btn.classList.toggle('wait', !live);
    const txt = live ? '\u25CF RECORDING \u00B7 talk now' : 'Mic starting\u2026 wait for red';
    if ($('pLastText').textContent !== txt) { $('pLastText').textContent = txt; $('pLastN').textContent = ''; $('pLastSub').textContent = live ? 'let go to save' : 'keep holding'; }
    if (live) {
      box.style.setProperty('--lastc', COL.red);
      const p = micPeak(); lv.hidden = false;
      if (p != null) { const db = 20 * Math.log10(p + 1e-9); lv.firstChild.style.width = Math.max(0, Math.min(100, (db + 60) / 60 * 100)) + '%'; lv.classList.toggle('hot', db > -3); }
    }
    requestAnimationFrame(pMeterLoop);
  }
  function phoneNoteRelease() {
    const st = pRec; if (!st) return;
    pRec = null; clearTimers(st);
    for (const e of document.querySelectorAll('#phone .down')) e.classList.remove('down');
    noteUp(st, () => toast('Hold NOTE to talk', 'Keep it held while you speak; let go to save', false, 2200)).finally(() => { phoneSig = ''; scheduleList(); });
    phoneSig = ''; scheduleList();
  }
  const phoneNoteUp = ev => { if (pRec && ev.pointerId === pRec.pid) phoneNoteRelease(); };
  window.addEventListener('pointerup', phoneNoteUp);
  window.addEventListener('pointercancel', phoneNoteUp);

  $('phone').addEventListener('pointerdown', ev => {
    pDownT = Date.now();
    const hb = ev.target.closest('[data-hold="note"]');
    if (hb) { ev.preventDefault(); haptic(10); phoneNoteDown(hb, ev.pointerId); return; }
    if (ev.target.closest('#pMain, #pTags')) haptic(10);   // the same click buzz as a remote key
  });
  $('phone').addEventListener('click', ev => {
    const b = ev.target.closest('button');
    if (!b) { if (ev.target === $('pMore')) closeMore(); return; }
    if (b.dataset.view || b.dataset.hold) return;
    const st = pSt();
    if (b.dataset.win) { settings.phoneWin = b.dataset.win === 'all' ? 'all' : +b.dataset.win; saveSettings(); haptic(15); scheduleList(); return; }
    if (b.dataset.act) { phoneAct(b.dataset.act, b, st); return; }
    const a = b.dataset.a, row = b.closest('.pr'); if (!a || !row) return;
    const m = derive().mByN.get(+row.dataset.n); if (!m) return;
    if (a === 'open') { phoneSel = phoneSel === m.n ? null : m.n; phoneScrollSel = true; haptic(10); renderPhone(true); return; }
    if (a === 'close') { phoneSel = null; renderPhone(true); return; }
    if (a === 'tag') tagToggle(m, b.dataset.tag, st);
    else if (a === 'rate') rateOn(m, st);
    else if (a === 'del') toggleDelete(m, st, 'tap UNDO DELETE to bring it back', 'tap DELETE to delete it again');
    else if (a === 'play') { const v = m.voices[m.voices.length - 1]; if (playingId === v.audio) stopAudio(); else playVoice(v); return; }
    else if (a === 'pv') openPreview(m.voices[m.voices.length - 1]);
    else if (a === 'text') addTextNote(m, 'PHONE');
    requestDraw();
  });
  $('pSess').addEventListener('click', () => openSheet('sessions'));
  $('pMenu').addEventListener('click', () => openSheet());

  // ---------- the Remote / Phone switch ----------
  function setView(v, initial) {
    v = v === 'phone' ? 'phone' : 'remote';
    if (!initial) { releaseAll(); phoneNoteRelease(); }   // a voice note being recorded is stopped and saved first
    if (!initial && v === view) return;
    view = v; LS.set(KEY.view, view);
    document.body.classList.toggle('v-phone', view === 'phone');
    for (const b of document.querySelectorAll('.seg.view button')) { const on = b.dataset.view === view; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }
    closeMore(); hideHint();
    listSig = ''; phoneSig = '';
    if (view === 'phone') renderPhone(true); else relabel();
    requestDraw();
    if (!initial) haptic(15);
  }
  for (const seg of document.querySelectorAll('.seg.view')) seg.addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) setView(b.dataset.view); });

  // ======================================================================
  // Start
  // ======================================================================
  window.addEventListener('pagehide', () => { releaseAll(); phoneNoteRelease(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  // ask the phone to keep the log and recordings even when storage runs low
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  // test hook: lets an automated check read the state (no effect on use)
  window.__editless = { derive: () => derive(), get layer() { return layer; }, get locked() { return locked; }, get session() { return session; },
    get events() { return events; }, settings, encodeWav, zip, Mic, EPD, HIST, get modeFrom() { return modeFrom; }, histSel: () => histSel(),
    markRows: id => markRows(id || session), actionRows: id => actionRows(id || session),
    pv: { PV, DSP, open: openPreview, load: pvLoadBlob, play: pvPlay, stop: pvStopPlay, ab: pvSetAB, exportWav: pvExport },
    get view() { return view; }, setView: v => setView(v), get phoneSel() { return phoneSel; } };
  setDevice(device);
  setView(view, true);
})();
</script>
</body>
